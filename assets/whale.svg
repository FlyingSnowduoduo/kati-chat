  <path d="M 190 162 C 230 132 242 182 190 162 Z" fill="#FF7BA6"/>
  <circle cx="190" cy="162" r="14" fill="#FF3D7E"/>
  <circle cx="164" cy="148" r="4.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="216" cy="148" r="4.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="172" cy="170" r="3" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="208" cy="170" r="3" fill="#FFFFFF" opacity="0.9"/>
