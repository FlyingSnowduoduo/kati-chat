  <circle cx="203" cy="255" r="3.5" fill="#FFFFFF" opacity="0.75"/>
  <circle cx="298" cy="248" r="19" fill="#16224D"/>
  <circle cx="304" cy="241" r="7" fill="#FFFFFF"/>
  <circle cx="291" cy="255" r="3.5" fill="#FFFFFF" opacity="0.75"/>

  <!-- 腮红 -->
  <ellipse cx="182" cy="290" rx="17" ry="11" fill="#FF9FBE" opacity="0.9"/>
  <ellipse cx="324" cy="290" rx="17" ry="11" fill="#FF9FBE" opacity="0.9"/>

  <!-- 微笑 -->
  <path d="M 240 298 Q 254 310 268 298" stroke="#16224D" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- 爱心 -->
  <path d="M 352 314 c -8 -6 -18 2 -14 11 c 2 5 8 9 14 15 c 6 -6 12 -10 14 -15 c 4 -9 -6 -17 -14 -11 Z" fill="#FF5D8F"/>

  <!-- 蝴蝶结（鲸鱼娘发饰） -->
