  <!-- 身体 -->
  <ellipse cx="256" cy="268" rx="118" ry="92" fill="url(#body)"/>

  <!-- 白肚皮 -->
  <g clip-path="url(#bodyClip)">
    <ellipse cx="238" cy="316" rx="78" ry="52" fill="#F4F9FF" opacity="0.95"/>
