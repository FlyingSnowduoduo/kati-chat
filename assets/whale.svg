  <path d="M 444 330 L 449 340 L 459 345 L 449 350 L 444 360 L 439 350 L 429 345 L 439 340 Z" fill="#FFFFFF" opacity="0.85"/>
  <path d="M 70 352 L 75 361 L 84 365 L 75 369 L 70 378 L 65 369 L 56 365 L 65 361 Z" fill="#FFD1E3"/>

  <!-- 尾鳍（右上翘起） -->
