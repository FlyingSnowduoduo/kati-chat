<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0F7FF"/>
      <stop offset="1" stop-color="#C9E1FF"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E8CFF"/>
      <stop offset="1" stop-color="#3D5AFE"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <ellipse cx="256" cy="268" rx="118" ry="92"/>
    </clipPath>
  </defs>

  <!-- 背景圆角方块 -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- 泡泡 -->
  <circle cx="74" cy="204" r="14" fill="none" stroke="#BBD7FF" stroke-width="5"/>
  <circle cx="50" cy="240" r="8" fill="none" stroke="#BBD7FF" stroke-width="4"/>

