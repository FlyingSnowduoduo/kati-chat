<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卡提聊天助手 · 本地 AI 翻译与聊天</title>
<link rel="icon" href="/img/whale.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header>
    <img class="logo" src="/img/whale.png" alt="卡提">
    <div class="title">
      <h1>卡提聊天助手 <span class="tag">本地运行 · 隐私无忧</span></h1>
      <p>图片英文识别 · 详细翻译 · 单词词组详解 · 办公聊天</p>
    </div>
    <div class="controls">
      <span id="dot" class="dot" title="服务状态"></span>
      <select id="model" title="选择模型"></select>
      <select id="answerLen" title="回答长度（越短越快）">
        <option value="brief">简洁 · 最快</option>
        <option value="normal">标准</option>
        <option value="rich">详细 · 较慢</option>
      </select>
      <select id="webMode" title="联网搜索">
        <option value="auto">联网 · 自动</option>
        <option value="on">联网 · 始终</option>
        <option value="off">联网 · 关闭</option>
      </select>
      <button id="clearBtn" class="icon-btn" title="清空聊天记录">🗑️</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden>⚠️ GPU 推理服务正在加载模型（约 10 秒）…若长时间无响应，请重新双击桌面图标</div>

  <main id="chat"></main>

  <div id="composer">
    <div id="chips">
      <button class="chip" data-mode="img">📷 图片翻译并详解</button>
      <button class="chip" data-mode="detail">📖 详细翻译</button>
      <button class="chip" data-mode="words">🧠 单词词组详解</button>
      <button class="chip" data-mode="mail">✉️ 邮件润色</button>
      <button class="chip" data-mode="chat">💬 日常聊天</button>
      <button class="chip" id="webChip" data-mode="web">🌐 联网搜索</button>
    </div>
    <div id="thumbs"></div>
    <div class="input-row">
      <button id="attachBtn" class="icon-btn" title="添加图片">🖼️</button>
      <button id="micBtn" class="icon-btn" title="语音输入（听我指令）">🎤</button>
      <textarea id="input" rows="1" placeholder="输入要翻译的文字，或粘贴 / 拖入图片…"></textarea>
      <button id="sendBtn">发送 ⬆</button>
    </div>
    <div class="hint">Ctrl+V 粘贴截图 · 拖拽图片 · 🎤 语音输入 · Enter 发送 / Shift+Enter 换行 · 🌐 联网 · 聊天记录保存在本机（🗑️ 清空）</div>
    <input type="file" id="fileInput" accept="image/*" multiple hidden>
  </div>
</div>

<script>
// 轻量自愈（内联，不依赖 app.js）：服务重启后本页自动刷新
(function () {
  var wasDown = false
  function ping() {
    fetch('/api/health', { cache: 'no-store' })
      .then(function (r) { return r.json() })
      .then(function () {
        if (wasDown) { wasDown = false; location.reload() }
      })
      .catch(function () { wasDown = true })
  }
  ping()
  setInterval(ping, 3000)
})()
</script>
<script src="/app.js"></script>
</body>
</html>
